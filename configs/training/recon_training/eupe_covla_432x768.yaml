include: ../../models/vrae_eupe_b_k7.yaml
task: recon_training
run_name: eupe_covla_recon_432x768_24f_4n32g_h800_gbs32_v2
model:
  decoder:
    # Keep the checkpoint's nominal 16x16 position table. Runtime positions are
    # interpolated to the 27x48 grid implied by data.image_size.
    image_size: [256, 256]
    # Global batch 32 on 32 GPUs gives one clip per rank. It fits at the
    # measured ~52.5 GiB, so avoid checkpoint recomputation on this speed run.
    gradient_checkpointing: false
    init: scratch
training:
  init_from: ckpts/recon_training/eupe_vrae_training_2/checkpoints/step-00122760.pt
  init_weights: ema
  resume: null
  epochs: 100
  checkpoint_interval: 1000
  # 32 GPUs x 1 clip/GPU = 32 globally = 8 clips on each 8-GPU node.
  global_batch_size: 32
  gradient_accumulation_steps: 1
  precision: bf16
  cudnn_benchmark: true
  ddp_static_graph: true
  ddp_gradient_as_bucket_view: true
  # The model is trained in BF16. Compressing the DDP buckets cuts the measured
  # 1.56-GiB/rank gradient payload in half; set to none for FP32 all-reduce.
  ddp_gradient_compression: bf16
  # Six workers already produce ~8 samples/s/rank, versus <2 needed by this
  # recipe. Workers only decode uint8; resize/crop stays on the GPU.
  num_workers: 6
  prefetch_factor: 1
  persistent_workers: true
  pin_memory: true
  optimizer:
    name: adamw
    lr: 5.0e-5
    betas: [0.9, 0.95]
    weight_decay: 0.0
  scheduler:
    name: constant
    warmup_steps: 0
  latent_noise:
    enabled: true
    tau: 0.8
    apply_in_eval: false
  ema:
    decay: 0.9995
data:
  dataset: covla
  manifest: metadata.jsonl
  expected_total: 10000
  verify_files: false
  split: train
  # Keep the manifest's final four videos out of training for fixed W&B previews.
  validation_fraction: 0.0004
  validation_count: 4
  validation_strategy: tail
  split_seed: 3407
  video_backend: auto
  torchcodec_seek_mode: approximate
  num_frames: 24
  frame_interval: 1
  image_size: [432, 768]
  sampling: random
  resize_mode: bicubic
  resize_antialias: true
  crop_mode: center
  random_flip: false
  spatial_on_gpu: true
  decode_threads: 1
  max_decode_attempts: 128
  fps: 20
  seed: 3407
loss:
  l1: 1.0
  lpips: 1.0
  gram: 100.0
  temporal_difference: 0.0
  perceptual_frames_per_chunk: 4
  perceptual_chunk_size: 4
  backbone_checkpoint: ckpts/pretrained/perceptual/vgg16.pt
  calibration_checkpoint: ckpts/pretrained/perceptual/lpips_vgg.pt
gan:
  enabled: true
  type: videomae
  generator_start_epoch: 5
  discriminator_start_epoch: 5
  update_interval: 5
  generator_weight: 0.3
  discriminator_checkpoint: ckpts/pretrained/discriminators/videomae/vit_b_hybrid_pt_800e.pth
  key_depths: [2, 5, 8, 11]
  head_kernel_size: 9
  head_norm_type: bn
  spectral_norm: true
  norm_eps: 1.0e-6
  diff_aug_prob: 1.0
  diff_aug_cutout: 0.2
  gen_loss_type: ns_g_loss
  disc_loss_type: ns_smooth
  lecam: true
  lecam_weight: 0.001
  discriminator_weight: 0.3
  input_range: zero_one
  input_clamp: true
  # The frozen pretrained VideoMAE discriminator expects 16 frames. Select 16
  # uniformly across each 24-frame reconstruction for its real/fake inputs.
  temporal_sampling: uniform
  optimizer:
    name: adamw
    lr: 1.0e-5
    betas: [0.9, 0.95]
    weight_decay: 1.0e-4
  scheduler:
    name: constant
    warmup_steps: 0
wandb:
  project: V-RAE
  group: cityscapes_video_prediction
  tags: [reconstruction, covla, eupe, 432x768, 24f, interval1, 32gpu, 4node, h800, gbs32]
  mode: online
  resume: allow
  log_interval: 20
  sample_interval: 500
  sample_count: 4
