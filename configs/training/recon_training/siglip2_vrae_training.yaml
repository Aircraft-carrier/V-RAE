include: ../../models/vrae_siglip2_l_k7.yaml
task: recon_training
run_name: siglip2_vrae_training

model:
  decoder:
    init: scratch

training:
  # This canonical recipe always starts from step 0; old 1e-4 checkpoints are
  # intentionally not accepted as initialization or exact-resume sources.
  init_from: null
  resume: null
  epochs: 50
  checkpoint_interval: 1000
  # Two nodes x eight GPUs x eight samples per GPU.
  global_batch_size: 128
  gradient_accumulation_steps: 1
  precision: bf16
  num_workers: 8
  pin_memory: true
  prefetch_factor: 2
  persistent_workers: false
  prefetch_to_device: true
  cudnn_benchmark: true
  compile_encoder: true
  compile_encoder_mode: reduce-overhead
  compile_encoder_fullgraph: false
  compile_decoder: true
  compile_decoder_mode: reduce-overhead
  compile_decoder_fullgraph: false
  compile_reconstruction_loss: true
  compile_reconstruction_loss_mode: reduce-overhead
  compile_reconstruction_loss_fullgraph: false
  ddp_static_graph: true
  ddp_gradient_as_bucket_view: true
  ddp_batched_grad_copy: true
  ddp_gradient_compression: none
  optimizer:
    name: adamw
    # Fresh-run learning rate requested for the consolidated recipe.
    lr: 2.0e-4
    betas: [0.9, 0.95]
    weight_decay: 0.0
  scheduler:
    name: constant
    warmup_steps: 0
  latent_noise:
    enabled: true
    tau: 0.8
    apply_in_eval: false
  ema:
    decay: 0.9995

data:
  sources:
    - name: ucf101
      manifest: data/metadata/ucf101_train_split1.csv
      manifest_scope: project
      split: null
    - name: k600
      manifest: data/metadata/k600_train.csv
      manifest_scope: project
      split: null
  # Video decoding stays on CPU; do not switch this recipe to CUDA/NVDEC.
  video_backend: torchcodec
  num_frames: 16
  frame_interval: 3
  image_size: 256
  sampling: random
  random_flip: true
  decode_threads: 1
  max_decode_attempts: 128
  fps: 8
  seed: 3407

loss:
  l1: 1.0
  lpips: 1.0
  gram: 100.0
  temporal_difference: 0.0
  perceptual_frames_per_chunk: 4
  perceptual_chunk_size: 4
  backbone_checkpoint: ckpts/pretrained/perceptual/vgg16.pt
  calibration_checkpoint: ckpts/pretrained/perceptual/lpips_vgg.pt

gan:
  enabled: true
  type: videomae
  generator_start_epoch: 30
  discriminator_start_epoch: 30
  update_interval: 5
  generator_weight: 0.3
  discriminator_checkpoint: ckpts/pretrained/discriminators/videomae/vit_b_hybrid_pt_800e.pth
  key_depths: [2, 5, 8, 11]
  head_kernel_size: 9
  head_norm_type: bn
  spectral_norm: true
  norm_eps: 1.0e-6
  diff_aug_prob: 1.0
  diff_aug_cutout: 0.2
  gen_loss_type: ns_g_loss
  disc_loss_type: ns_smooth
  lecam: true
  lecam_weight: 0.001
  discriminator_weight: 0.3
  input_range: zero_one
  input_clamp: true
  optimizer:
    name: adamw
    lr: 2.0e-5
    betas: [0.9, 0.95]
    weight_decay: 1.0e-4
  scheduler:
    name: constant
    warmup_steps: 0
wandb:
  project: V-RAE
  group: reconstruction
  tags: [reconstruction, siglip2]
  mode: online
  resume: never
  log_interval: 20
  sample_interval: 1000
  sample_count: 4
