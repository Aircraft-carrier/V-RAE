include: eupe_vrae_training.yaml
task: recon_training
run_name: lerobot_multiview
model:
  multiview:
    enabled: true
    num_views: 2
    num_streams: 2
    use_view_embedding: true
    use_view_attention: true
training:
  init_from: null
  resume: null
  epochs: 40
data:
  dataset: lerobot
  root: /zsh/cache/data/Lerobot/libero
  repo_id: libero
  camera_keys:
    - {key: observation.images.image, name: head, stream_id: 0}
    - {key: observation.images.image2, name: wrist, stream_id: 1}
  num_frames: 16
  frame_interval: 1
  sampling: random
  image_size: 256
  random_flip: false
gan:
  enabled: false
