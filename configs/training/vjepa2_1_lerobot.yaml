include: ../models/vrae_vjepa2_1_l_k7.yaml
task: recon_training
run_name: vjepa2_1_lerobot
model:
  decoder:
    init: scratch
    attention_mode: full
training:
  init_from: null
  resume: null
  epochs: 50
  checkpoint_interval: 1000
  global_batch_size: 128
  gradient_accumulation_steps: 1
  precision: bf16
  num_workers: 4
  optimizer:
    name: adamw
    lr: 2.0e-4
    betas: [0.9, 0.95]
    weight_decay: 0.0
  scheduler:
    name: constant
    warmup_steps: 0
  latent_noise:
    enabled: true
    tau: 0.8
    apply_in_eval: false
  ema:
    decay: 0.9995
data:
  dataset: lerobot
  root: null
  repo_id: your-org/your-lerobot-dataset
  camera_keys:
    - {key: observation.images.image, name: camera, stream_id: 0}
  num_frames: 16
  frame_interval: 1
  sampling: random
  image_size: 256
  random_flip: false
  seed: 3407
loss:
  l1: 1.0
  lpips: 1.0
  gram: 100.0
  temporal_difference: 0.0
  perceptual_frames_per_chunk: 4
  perceptual_chunk_size: 4
  backbone_checkpoint: ckpts/pretrained/perceptual/vgg16.pt
  calibration_checkpoint: ckpts/pretrained/perceptual/lpips_vgg.pt
wandb:
  project: V-RAE
  group: reconstruction
  tags: [reconstruction, vjepa2_1]
  mode: online
  resume: allow
  log_interval: 20
  sample_interval: 1000
  sample_count: 4
