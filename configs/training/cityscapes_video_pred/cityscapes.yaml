include:
  - ../../models/vrae_eupe_b_k7.yaml
  - ../../models/dit_video_prediction.yaml
task: cityscapes_video_pred
run_name: eupe_cityscapes
stage1:
  checkpoint: ckpts/vrae/vrae_eupe.pt
  weights: ema
  precision: bf16
latent_normalizer:
  path: ckpts/cityscapes_video_pred/latent_stats/eupe_cityscapes_12future_vrae_ema_bf16.pt
dit:
  input_dim: 768
transport:
  prediction: x
  time_dist_type: logit-normal_0_1
  time_dist_shift: 27.0
  t_eps: 0.05
  base_model_coeff: 1.0
training:
  resume: null
  init_from: null
  global_batch_size: 16
  gradient_accumulation_steps: 1
  epochs: 100
  checkpoint_interval: 1000
  precision: bf16
  optimizer: {name: adamw, lr: 1.0e-4, betas: [0.9, 0.95], weight_decay: 0.05}
  scheduler: {name: constant, warmup_steps: 0}
  ema: {decay: 0.9995}
data:
  dataset: cityscapes
  split: train
  image_size: [432, 768]
  fps: 16
  context_frames: [4, 15]
  future_frames: [16, 27]
  video_backend: auto
  latent_cache: null
sampling: {base_seed: 3407, steps: 100, cfg_scale: 1.0, internal_guidance_scale: 1.0}
wandb:
  project: V-RAE
  group: cityscapes_video_prediction
  tags: [cityscapes, video_prediction, eupe]
  mode: offline
  resume: allow
  log_interval: 20
  sample_interval: 1000
  sample_count: 2
