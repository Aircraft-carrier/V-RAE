include:
  - ../../models/vrae_siglip2_l_k7.yaml
  - ../../models/dit_class_cond.yaml
task: k600_videogen
run_name: siglip2_k600
stage1:
  checkpoint: ckpts/vrae/vrae_siglip2.pt
  weights: ema
  precision: bf16
latent_normalizer:
  path: ckpts/k600_videogen/latent_stats/siglip2_k600_20f_vrae_ema_bf16.pt
dit:
  num_classes: 600
  attention_backend: auto
  gradient_checkpointing: false
transport:
  prediction: x
  time_dist_type: logit-normal_0_1
  time_dist_shift: 17.88854381999832
  t_eps: 0.05
  base_model_coeff: 1.0
training:
  resume: null
  init_from: null
  global_batch_size: 128
  gradient_accumulation_steps: 1
  clip_grad: 1.0
  epochs: 150
  checkpoint_interval_epochs: 1
  precision: bf16
  optimizer: {name: adamw, lr: 1.0e-4, betas: [0.9, 0.95], weight_decay: 0.0, eps: 1.0e-8}
  scheduler: {name: linear, warmup_epochs: 2, decay_end_epoch: 150, base_lr: 1.0e-4, final_lr: 5.0e-5, warmup_from_zero: true}
  ema: {decay: 0.9995}
data:
  dataset: k600
  split: train
  manifest: data/metadata/k600_train.csv
  manifest_scope: project
  manifest_split: null
  num_frames: 20
  frame_interval: 3
  image_size: 256
  video_backend: torchcodec
  max_decode_attempts: 128
  random_flip: true
  crop_mode: random
  seed: 3407
runtime:
  data_pipeline:
    kind: torchcodec_cpu_bounded
    torchcodec_seek_mode: approximate
    torchcodec_num_ffmpeg_threads: 1
    torchcodec_cpu_decode_threads: 16
    torchcodec_cpu_max_inflight: 128
    torchcodec_cpu_max_buffered_batches: 16
    torchcodec_cpu_async_prefetch_batches: 8
    torchcodec_cpu_max_decode_attempts_per_batch: 2048
    torchcodec_cpu_pin_memory: true
    torchcodec_cpu_glibc_arena_max: 2
    torchcodec_cpu_glibc_trim_threshold_bytes: 134217728
    torchcodec_cpu_trim_heap_each_epoch: true
    torchcodec_cpu_collect_python_each_epoch: false
  checkpoint:
    mmap: true
    drop_page_cache: true
  host_memory:
    log: true
    min_available_gb: 128
sampling:
  base_seed: 3407
  steps: 100
  cfg_scale: 1.0
  internal_guidance_scale: 1.78
  internal_guidance_t_min: 0.10
  internal_guidance_t_max: 1.0
wandb:
  project: V-RAE
  group: k600_videogen
  tags: [k600, class_conditional, siglip2, 20f, ema]
  mode: online
  resume: never
  log_interval: 20
  sample_interval: 1000
  sample_count: 4
