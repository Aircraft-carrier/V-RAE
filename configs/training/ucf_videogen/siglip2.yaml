include:
  - ../../models/vrae_siglip2_l_k7.yaml
  - ../../models/dit_class_cond.yaml
task: ucf_videogen
run_name: siglip2_ucf101
stage1:
  checkpoint: ckpts/vrae/vrae_siglip2.pt
  weights: ema
latent_normalizer:
  path: ckpts/ucf_videogen/latent_stats/siglip2_ucf101_16f_vrae_ema.pt
dit:
  num_classes: 101
  gradient_checkpointing: false
transport:
  prediction: x
  time_dist_type: logit-normal_0_1
  time_dist_shift: 16.0
  t_eps: 0.05
  base_model_coeff: 1.0
training:
  resume: null
  init_from: null
  global_batch_size: 256
  gradient_accumulation_steps: 1
  epochs: 100
  checkpoint_interval: 1000
  precision: bf16
  optimizer: {name: adamw, lr: 1.0e-4, betas: [0.9, 0.95], weight_decay: 0.05}
  scheduler: {name: constant, warmup_steps: 0}
  ema: {decay: 0.9995}
data:
  dataset: ucf101
  split: train
  num_frames: 16
  image_size: 256
  video_backend: auto
sampling:
  base_seed: 3407
  steps: 100
  cfg_scale: 1.0
  internal_guidance_scale: 1.3
wandb:
  project: V-RAE
  group: ucf101_videogen
  tags: [ucf101, class_conditional, siglip2]
  mode: offline
  resume: allow
  log_interval: 20
  sample_interval: 1000
  sample_count: 4
