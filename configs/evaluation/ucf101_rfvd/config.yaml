task: ucf101_rfvd
run:
  name: ucf101-rfvd-formal
checkpoints:
  stage1: ckpts/vrae/replace-with-vrae.pt
extractors:
  i3d: ckpts/eval_models/i3d_torchscript.pt
  lpips: ckpts/eval_models/lpips/lpips_vgg.pt
inputs:
  population: data/metadata/ucf101_test_split1_rfvd.json
  population_metadata: null
  data_root: data/UCF-101
  real_features: null
  reconstructed_features: null
  paired_metrics: null
