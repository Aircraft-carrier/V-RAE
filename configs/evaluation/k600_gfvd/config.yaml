task: k600_gfvd
run:
  name: k600-gfvd-formal
checkpoints:
  stage1: ckpts/vrae/replace-with-vrae.pt
  dit: ckpts/k600_dit/replace-with-k600-dit.pt
  latent_normalizer: ckpts/k600_dit/replace-with-latent-stats.pt
extractors:
  i3d: ckpts/eval_models/i3d_torchscript.pt
inputs:
  population: data/metadata/k600_train_gfvd50k_first200x84.jsonl
  population_metadata: data/metadata/k600_train_gfvd50k_first200x84.metadata.json
  data_root: data/Kinetics-600
  real_features: null
  generated_features: null
evaluation:
  stage1_weights: ema
  dit_weights: ema
  split: train
  population_size: 50000
  class_quota: 200x84_plus_400x83
  base_seed: 3407
  sampler_steps: 100
  guidance: 1.0
  internal_guidance_scale: 1.78
  internal_guidance_t_min: 0.1
  internal_guidance_t_max: 1.0
  model_frames: 20
  i3d_frame_slice: [0, 17]
  image_size: [256, 256]
  covariance: population
  global_batch_size: 512
  precision: bf16
  attention_backend: auto
  video_backend: torchcodec
  seek_mode: approximate
  decode_threads: 1
  i3d_batch_size: 32
