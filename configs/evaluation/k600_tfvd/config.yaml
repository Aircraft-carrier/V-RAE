task: k600_tfvd
run:
  name: k600-tfvd-formal
checkpoints:
  stage1: ckpts/vrae/replace-with-vrae.pt
extractors:
  i3d: ckpts/eval_models/i3d_torchscript.pt
inputs:
  population: data/metadata/k600_val_tfvd_f24_dt3_torchcodec_approximate.json
  population_metadata: data/metadata/k600_val_tfvd.metadata.json
  data_root: data/Kinetics-600
  reference_features: null
  interpolated_features: null
  source_clips: null
  reference_clips: null
  interpolated_clips: null
evaluation:
  stage1_weights: ema
  split: val
  population_size: 27814
  frame_start: 0
  frame_interval: 3
  source_frames: 24
  output_frames: 16
  interpolation: centered_6_to_4_linear
  reference_crop: [4, 20]
  image_size: [256, 256]
  covariance: sample
  video_backend: torchcodec
  seek_mode: approximate
  decode_threads: 1
  num_workers: 4
  prefetch_factor: 1
  global_batch_size: 1024
  precision: bf16
  attention_backend: sdpa
  i3d_batch_size: 32
  seed: 42
  cudnn_benchmark: false
  cudnn_deterministic: true
