task: ucf101_gfvd
run:
  name: ucf101-gfvd-formal
checkpoints:
  stage1: ckpts/vrae/replace-with-vrae.pt
  dit: ckpts/ucf101_dit/replace-with-ucf101-dit.pt
  latent_normalizer: ckpts/ucf101_dit/replace-with-latent-stats.pt
extractors:
  i3d: ckpts/eval_models/i3d_torchscript.pt
inputs:
  population: data/metadata/ucf101_train_split1.csv
  population_metadata: null
  population_path_column: path
  data_root: data/UCF-101
  video_length_cache: null
  real_features: null
  generated_features: null
  real_clips: null
  generated_clips: null
evaluation:
  stage1_weights: ema
  dit_weights: ema
  split: train
  population_size: 2048
  base_seed: 3407
  sampler_steps: 100
  guidance: 1.0
  internal_guidance_scale: 1.3
  internal_guidance_t_min: 0.1
  internal_guidance_t_max: 1.0
  num_frames: 17
  model_frames: 20
  frame_interval: 3
  real_frame_interval: 3
  generated_frame_interval: 1
  real_preprocessing: center_square_lanczos
  generated_video_format: imageio_mp4
  fps: 8
  image_size: [256, 256]
  global_batch_size: 512
  generation_batch_size: 64
  i3d_batch_size: 7
  precision: bf16
  attention_backend: sdpa
  decode_threads: 1
  covariance: population
