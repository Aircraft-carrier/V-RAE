task: k600_rfvd
run:
  name: k600-rfvd-formal
checkpoints:
  stage1: ckpts/vrae/replace-with-vrae.pt
extractors:
  i3d: ckpts/eval_models/i3d_torchscript.pt
  lpips: ckpts/pretrained/perceptual/lpips_vgg.pt
inputs:
  population: data/metadata/k600_val_rfvd_torchcodec_approximate.json
  population_metadata: data/metadata/k600_val_rfvd.metadata.json
  data_root: data/Kinetics-600
  real_features: null
  reconstructed_features: null
  paired_metrics: null
  real_clips: null
  reconstructed_clips: null
evaluation:
  stage1_weights: ema
  split: val
  population_size: 27874
  frame_start: 0
  frame_interval: 3
  num_frames: 16
  image_size: [256, 256]
  covariance: sample
  video_backend: torchcodec
  seek_mode: approximate
  decode_threads: 1
  num_workers: 4
  prefetch_factor: 1
  global_batch_size: 1024
  precision: bf16
  attention_backend: sdpa
  i3d_batch_size: 32
  perceptual_batch_size: 32
  seed: 42
  cudnn_benchmark: true
  cudnn_deterministic: false
  real_feature_cache: outputs/k600_rfvd/_cache/k600-val-f16-dt3-real-i3d-four-vrae
